# Confie Brand Negative Keyword Configuration
# =============================================
# Sources:
#   - User-provided subsidiary list
#   - Vern Fonk Affiliate Disclosure (https://www.vernfonk.com/affiliated-companies/, last updated 2025-04-11)
#   - Freeway Affiliate Disclosure (https://www.freeway.com/affiliate-disclosure/)
#   - Confie Wikipedia (https://en.wikipedia.org/wiki/Confie)
#   - Confie press releases (confie.com/newsroom/)
#
# Schema per brand:
#   canonical:        Official brand name (used as the source label in output)
#   aliases:          List of phrases to match in queries (whole-word, case-insensitive)
#   legal_entities:   Registered LLC/Inc names (matched as phrases, separate match list)
#   disqualifiers:    If any of these phrases appears anywhere in the query, the match is discarded
#                     (used for ambiguous brand fragments that collide with other companies/places)
#   require_context:  If set, an alias only counts as a match when one of these context words also
#                     appears in the query. Used for highly-ambiguous tokens (e.g. "harmony", "bower")
#   broad_safe:       true if the brand is distinctive enough to be safely negated as Broad Match
#                     (multi-word, unambiguous). Defaults to false.

# ============================================================================
# PARENT COMPANY
# ============================================================================
- canonical: Confie
  aliases: [confie, confie seguros, confie insurance]
  legal_entities: [Confie Estrella Inc, Confie Premium Finance LLC, Confie Digital Services]
  disqualifiers: []
  broad_safe: true

